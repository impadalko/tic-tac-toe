<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>Tic-tac-toe</title>
  </head>

  <body>
    <input type="checkbox" id="cell-1-x" class="hidden">
    <input type="checkbox" id="cell-2-x" class="hidden">
    <input type="checkbox" id="cell-3-x" class="hidden">
    <input type="checkbox" id="cell-4-x" class="hidden">
    <input type="checkbox" id="cell-5-x" class="hidden">
    <input type="checkbox" id="cell-6-x" class="hidden">
    <input type="checkbox" id="cell-7-x" class="hidden">
    <input type="checkbox" id="cell-8-x" class="hidden">
    <input type="checkbox" id="cell-9-x" class="hidden">

    <div class="game-board">
      <div class="grid-cell">
        <label for="cell-1-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-1-o">O</div>
      </div>

      <div class="grid-cell">
        <label for="cell-2-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-2-o">O</div>
      </div>

      <div class="grid-cell">
        <label for="cell-3-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-3-o">O</div>
      </div>

      <div class="grid-cell">
        <label for="cell-4-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-4-o">O</div>
      </div>

      <div class="grid-cell">
        <label for="cell-5-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-5-o">O</div>
      </div>

      <div class="grid-cell">
        <label for="cell-6-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-6-o">O</div>
      </div>

      <div class="grid-cell">
        <label for="cell-7-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-7-o">O</div>
      </div>

      <div class="grid-cell">
        <label for="cell-8-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-8-o">O</div>
      </div>

      <div class="grid-cell">
        <label for="cell-9-x" class="user-move-label"></label>
        <div class="marker user-marker">X</div>
        <div class="marker ai-marker cell-9-o">O</div>
      </div>
    </div>
  </body>
</html>
